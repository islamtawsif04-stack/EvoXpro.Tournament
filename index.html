<script>
    // --- [NEW CONFIG] FIREBASE CONFIG INITIALIZED (V8 COMPATIBLE) ---
    const firebaseConfig = {
      apiKey: "AIzaSyBhL1_ZDpGTb4DLyDeu4EyWbAhHolVrVDE",
      authDomain: "evoxpro-33b80.firebaseapp.com",
      // আপনার নতুন সিঙ্গাপুর রিজিয়নের ডাটাবেজ ইউআরএল
      databaseURL: "https://evoxpro-33b80-default-rtdb.asia-southeast1.firebasedatabase.app",

    // ফায়ারবেস ইনিশিয়ালাইজেশন
    firebase.initializeApp(firebaseConfig);

    let myData = null, myUID = null, targetUID = null, allMatches = {}, currentServerStatus = "on", selectedCategory = "";

    // --- NAVIGATION FUNCTION ---
    function showP(pageId, element) {
        document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
        const targetPage = document.getElementById(pageId);
        if(targetPage) targetPage.classList.add('active');
        if(element) {
            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.classList.remove('text-yellow-500');
                item.classList.add('text-slate-500');
            });
            element.classList.remove('text-slate-500');
            element.classList.add('text-yellow-500');
        }
    }

    // --- GLOBAL ADMIN LOGIN FUNCTION ---
    function adminLogin() {
        const pass = prompt("Enter Admin Password:");
        if(pass === "tawsif728027") { 
            showP('admin');
        } else {
            alert("Wrong Password! Access Denied.");
        }
    }

    // Categories Data Setup
    const categories = [
        { name: "Lone Wolf 1v1", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=400&auto=format&fit=crop" },
        { name: "BR Solo Classic", img: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=400&auto=format&fit=crop" },
        { name: "Duo Custom", img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=400&auto=format&fit=crop" }
    ];                    

    const catGrid = document.getElementById('category-grid');
    if(catGrid) {
        catGrid.innerHTML = "";
        categories.forEach(function(c) {
            catGrid.innerHTML += '<div class="glow-card p-4 rounded-[2.5rem] cursor-pointer active:scale-95 text-center" onclick="openMatches(\'' + c.name + '\')"><img src="' + c.img + '" class="w-full h-32 object-cover rounded-3xl mb-3 shadow-md"><h4 class="text-xs font-black uppercase text-gray-200">' + c.name + '</h4></div>';
        });
    }

    // Open Matches function
    function openMatches(categoryName) {
        selectedCategory = categoryName;
        document.getElementById('match-cat-title').innerText = categoryName;
        renderCategoryMatches(categoryName);
        showP('match-details');
    }

    // Render Live Matches for Users
    function renderCategoryMatches(categoryName) {
        const container = document.getElementById('matches-container');
        if(!container) return;
        container.innerHTML = "";
        let hasMatch = false;

        for(let key in allMatches) {
            const m = allMatches[key];
            if(m.category === categoryName && m.status !== 'completed') {
                hasMatch = true;
                const joinedCount = m.joinedPlayers ? Object.keys(m.joinedPlayers).length : 0;
                const isFull = joinedCount >= (m.slots || 50);
                const isJoined = m.joinedPlayers && m.joinedPlayers[myUID];

                container.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 p-5 rounded-[2.5rem] space-y-3 glow-card">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="text-md font-black text-white italic uppercase">${m.title}</h3>
                                <p class="text-[10px] text-yellow-500 font-bold"><i class="fa-solid fa-clock"></i> ${m.time}</p>
                            </div>
                            <span class="bg-gray-800 text-slate-400 text-[9px] px-2.5 py-1 rounded-full font-bold border border-gray-700">Slots: ${joinedCount}/${m.slots}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 bg-gray-950/50 p-3 rounded-2xl text-center text-[10px] font-bold border border-gray-800/50">
                            <div><p class="text-slate-500 uppercase text-[8px]">Prize Pool</p><p class="text-green-400 font-black text-xs">৳${m.prize}</p></div>
                            <div><p class="text-slate-500 uppercase text-[8px]">Per Kill</p><p class="text-red-400 font-black text-xs">৳${m.perkill}</p></div>
                            <div><p class="text-slate-500 uppercase text-[8px]">Entry Fee</p><p class="text-yellow-500 font-black text-xs">৳${m.fee}</p></div>
                        </div>
                        ${isJoined ? `
                            <div class="bg-blue-600/10 border border-blue-500/20 p-3 rounded-xl text-center">
                                <p class="text-[10px] font-black text-blue-400 uppercase">Room Details</p>
                                <p class="text-xs text-white font-mono mt-1">ID: ${m.roomId || 'Wait...'} | Pass: ${m.roomPass || 'Wait...'}</p>
                            </div>
                        ` : `
                            <button onclick="joinMatchPopup('${key}', ${m.fee}, ${isFull})" class="w-full ${isFull ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : 'bg-yellow-500 text-black'} py-3 rounded-xl font-black text-[10px] uppercase shadow-md btn-animate">
                                ${isFull ? 'Match Full' : 'Join Match'}
                            </button>
                        `}
                    </div>`;
            }
        }
        if(!hasMatch) container.innerHTML = '<p class="text-center text-slate-500 text-xs font-bold py-8">No Live Matches Available!</p>';
    }

    function autoFillTitle() {
        const cat = document.getElementById('m-cat').value;
        document.getElementById('m-title').value = cat + " - Match #";
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.add('hidden'); });
        document.getElementById(tabId).classList.remove('hidden');
        const btnDep = document.getElementById('btn-dep');
        const btnWd = document.getElementById('btn-wd');
        if (tabId === 'dep-tab') {
            if(btnDep) btnDep.className = "flex-1 py-3.5 rounded-xl font-black text-[10px] uppercase bg-gray-800 text-yellow-500 border border-gray-700 shadow-md btn-animate";
            if(btnWd) btnWd.className = "flex-1 py-3.5 rounded-xl font-black text-[10px] uppercase text-slate-400 btn-animate";
        } else {
            if(btnWd) btnWd.className = "flex-1 py-3.5 rounded-xl font-black text-[10px] uppercase bg-gray-800 text-yellow-500 border border-gray-700 shadow-md btn-animate";
            if(btnDep) btnDep.className = "flex-1 py-3.5 rounded-xl font-black text-[10px] uppercase text-slate-400 btn-animate";
        }
    }

    // --- USER LOGIN & LOGOUT SYSTEM ---
    function login() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then(function(res) {
            const u = res.user;
            db.ref('users/' + u.uid).once('value', function(s) {
                if(!s.exists()) {
                    db.ref('app_stats/last_id').transaction(function(id) { return (id || 78899) + 1; }, function(err, com, snap) {
                        if(com) {
                            const newId = snap.val().toString();
                            db.ref('users/' + u.uid).set({ name: u.displayName, email: u.email, balance: 0, shortId: newId, photo: u.photoURL, uid: u.uid, matchesPlayed: 0, totalKills: 0, totalWon: 0 });
                            db.ref('id_map/' + newId).set(u.uid).then(function() { location.reload(); });
                        }
                    });
                } else { location.reload(); }
            });
        }).catch(function(err) { alert(err.message); });
    }

    function logout() { if(confirm("Logout করবেন?")) auth.signOut().then(function() { location.reload(); }); }

    auth.onAuthStateChanged(function(user) {
        if(user) {
            myUID = user.uid;
            db.ref('users/' + user.uid).on('value', function(s) {
                myData = s.val() || {};
                document.getElementById('u-bal').innerText = (myData.balance || 0).toFixed(2);
                document.getElementById('my-short-id').innerText = "ID: " + (myData.shortId || "-----");
                document.getElementById('stat-played').innerText = myData.matchesPlayed || 0;
                document.getElementById('stat-kills').innerText = myData.totalKills || 0;
                document.getElementById('stat-won').innerText = "৳" + (myData.totalWon || 0);
                document.getElementById('user-header').innerHTML = '<img src="' + user.photoURL + '" class="w-8 h-8 rounded-full border-2 border-yellow-500 shadow-sm"><button onclick="logout()" class="bg-red-500 text-white px-2 py-1 rounded-md text-[9px] font-bold uppercase btn-animate">Logout</button>';
            });
        }
    });

    // --- WALLET & MONEY REQUESTS ---
    function moneyRequest(type) {
        if(!myUID) return alert("প্রথমে লগইন করুন!");
        if(type === 'Deposit') {
            const amt = Number(document.getElementById('dep-amt').value);
            const trx = document.getElementById('dep-trx').value.trim();
            if(!amt || trx === "") return alert("সব তথ্য সঠিকভাবে পূরণ করুন!");
            if(amt < 10) return alert("সর্বনিম্ন ১০ টাকা ডিপোজিট করতে পারবেন।");
            db.ref('money_requests').push({
                uid: myUID, name: myData.name, shortId: myData.shortId, type: 'Deposit', amount: amt, info: trx, status: 'pending', timestamp: Date.now()
            }).then(function() {
                alert("Deposit Request Submitted Successfully!");
                document.getElementById('dep-amt').value = ""; document.getElementById('dep-trx').value = "";
            });
        } else {
            const amt = Number(document.getElementById('wd-amt').value);
            const num = document.getElementById('wd-num').value.trim();
            if(!amt || num === "") return alert("সব তথ্য সঠিকভাবে পূরণ করুন!");
            if(amt > myData.balance) return alert("আপনার একাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");
            if(amt < 50) return alert("সর্বনিম্ন ৫০ টাকা উইথড্র করতে পারবেন।");
            db.ref('users/' + myUID).transaction(function(user) {
                if(user) {
                    if(user.balance >= amt) {
                        user.balance -= amt;
                        db.ref('money_requests').push({
                            uid: myUID, name: myData.name, shortId: myData.shortId, type: 'Withdraw', amount: amt, info: num, status: 'pending', timestamp: Date.now()
                        });
                    } else { alert("Insufficient Balance!"); }
                }
                return user;
            }).then(function() {
                alert("Withdraw Request Submitted Successfully!");
                document.getElementById('wd-amt').value = ""; document.getElementById('wd-num').value = "";
            });
        }
    }

    // --- JOIN TOURNAMENT SYSTEM ---
    function joinMatchPopup(matchKey, fee, isFull) {
        if(!myUID) return alert("ম্যাচে জয়েন করতে প্রথমে লগইন করুন!");
        if(isFull) return alert("এই ম্যাচের সব স্লট ফিলাপ হয়ে গেছে!");
        if(myData.balance < fee) return alert("আপনার একাউন্টে পর্যাপ্ত টাকা নেই! ওয়ালেট থেকে ডিপোজিট করুন।");
        const gName = prompt("আপনার In-Game Name (IGN) দিন:");
        const gUID = prompt("আপনার Game UID দিন:");
        if(!gName || !gUID) return alert("সঠিক গেম ডিটেইলস দেওয়া আবশ্যক!");

        db.ref('matches/' + matchKey).transaction(function(match) {
            if(match) {
                if(!match.joinedPlayers) match.joinedPlayers = {};
                if(Object.keys(match.joinedPlayers).length >= (match.slots || 50)) return;
                match.joinedPlayers[myUID] = { gameName: gName, gameUID: gUID, timestamp: Date.now() };
                db.ref('users/' + myUID).transaction(function(user) {
                    if(user) user.balance -= fee;
                    return user;
                });
            }
            return match;
        }).then(function() { alert("Successfully Joined the Tournament!"); });
    }

    // --- ADD NEW MATCH FUNCTION ---
    function addMatch() {
        const category = document.getElementById('m-cat').value;
        const title = document.getElementById('m-title').value.trim();
        const time = document.getElementById('m-time').value.trim();
        const fee = parseInt(document.getElementById('m-fee').value) || 0;
        const prize = parseInt(document.getElementById('m-prize').value) || 0;
        const perkill = parseInt(document.getElementById('m-perkill').value) || 0;
        const slots = parseInt(document.getElementById('m-slots').value) || 50;

        if(!title || !time) return alert("ম্যাচ টাইটেল এবং টাইম অবশ্যই দিতে হবে!");

        db.ref('matches').push({
            category, title, time, fee, prize, perkill, slots, status: 'live', roomId: '', roomPass: ''
        }).then(() => {
            alert("Match Added Successfully!");
            document.getElementById('m-title').value = "";
            document.getElementById('m-time').value = "";
        });
    }

    // --- SEARCH USER & DIRECT CASH ADD ---
    function searchUser() {
        const shortId = document.getElementById('s-id').value.trim();
        if(!shortId) return alert("ID দিন!");
        db.ref('id_map/' + shortId).once('value', function(snap) {
            if(snap.exists()) {
                targetUID = snap.val();
                db.ref('users/' + targetUID).once('value', function(uSnap) {
                    const u = uSnap.val();
                    document.getElementById('res-div').classList.remove('hidden');
                    document.getElementById('res-name').innerText = `User: ${u.name} | Current Bal: ৳${u.balance}`;
                });
            } else { alert("User Not Found!"); }
        });
    }

    function addCashDirect() {
        const amt = parseFloat(document.getElementById('add-amt').value);
        if(!amt || !targetUID) return alert("সঠিক অ্যামাউন্ট দিন!");
        db.ref('users/' + targetUID).transaction(function(user) {
            if(user) user.balance = (user.balance || 0) + amt;
            return user;
        }).then(() => {
            alert("Cash Added Successfully!");
            searchUser(); 
        });
    }

    // --- UPDATE ROOM ID / PASS ---
    function updateRoomLive(key) {
        const rId = document.getElementById('rid-' + key).value.trim();
        const rPass = document.getElementById('rpass-' + key).value.trim();
        db.ref('matches/' + key).update({ roomId: rId, roomPass: rPass }).then(() => {
            alert("Room Info Updated!");
        });
    }

    // --- DELETE MATCH ---
    function deleteMatch(key) {
        if(confirm("ম্যাচটি ডিলিট করতে চান?")) {
            db.ref('matches/' + key).remove().then(() => alert("Match Deleted!"));
        }
    }

    // --- SERVER CONTROL ---
    function toggleServer() {
        const nextStatus = currentServerStatus === "on" ? "off" : "on";
        db.ref('app_stats/server').set(nextStatus);
    }

    db.ref('app_stats/server').on('value', function(snap) {
        currentServerStatus = snap.val() || "on";
        const srvBtn = document.getElementById('srv-btn');
        const mUi = document.getElementById('m-ui');
        if(srvBtn) {
            srvBtn.innerText = currentServerStatus === "on" ? "STOP SERVER (MAINTENANCE)" : "START SERVER LIVE";
            srvBtn.className = currentServerStatus === "on" ? "w-full py-3.5 rounded-xl font-black text-[10px] border border-red-500 text-red-500 uppercase btn-animate" : "w-full py-3.5 rounded-xl font-black text-[10px] border border-green-500 text-green-500 uppercase btn-animate";
        }
        if(mUi) {
            if(currentServerStatus === "off") mUi.classList.remove('hidden');
            else mUi.classList.add('hidden');
        }
    });

    // Listen to Matches data
    db.ref('matches').on('value', function(snap) {
        allMatches = snap.val() || {};
        if (selectedCategory) renderCategoryMatches(selectedCategory);
        renderAdminControl();
        renderResults();
    });

    // --- RENDER RESULTS PAGE FOR USERS ---
    function renderResults() {
        const resContainer = document.getElementById('results-container');
        if(!resContainer) return;
        resContainer.innerHTML = "";
        let hasResult = false;

        for(let key in allMatches) {
            const m = allMatches[key];
            if(m.status === 'completed') {
                hasResult = true;
                let winnersHTML = '<div class="mt-2 space-y-1 text-xs text-slate-400">';
                if(m.winners) {
                    m.winners.forEach(w => {
                        winnersHTML += `<p><span class="text-white font-bold">${w.gameName}</span> - Kills: ${w.kills} | Won: ৳${w.won} ${w.isBooyah ? '' : ''}</p>`;
                    });
                }
                winnersHTML += '</div>';

                resContainer.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 p-5 rounded-[2.5rem]">
                        <h4 class="text-sm font-black text-yellow-500 italic uppercase">${m.title}</h4>
                        <p class="text-[9px] text-slate-500 font-bold uppercase mb-2">Category: ${m.category}</p>
                        <hr class="border-gray-800">
                        ${winnersHTML}
                    </div>`;
            }
        }
        if(!hasResult) resContainer.innerHTML = '<p class="text-center text-slate-500 text-xs font-bold py-8">No Match Results Published Yet.</p>';
    }

    // --- ADMIN CONTROLS RENDERING ---
    function renderAdminControl() {
        const adminMatchesControl = document.getElementById('admin-matches-control');
        if(!adminMatchesControl) return;
        adminMatchesControl.innerHTML = "";
        for(let key in allMatches) {
            const m = allMatches[key];
            if(m.status === 'completed') continue; 
            const joinedCount = m.joinedPlayers ? Object.keys(m.joinedPlayers).length : 0;
            let playerListHTML = "";
            if(m.joinedPlayers) {
                playerListHTML = '<div class="bg-gray-950/60 p-2 rounded-xl mt-2 space-y-2 max-h-48 overflow-y-auto">';
                for(let pUID in m.joinedPlayers) {
                    const pData = m.joinedPlayers[pUID];
                    playerListHTML += '<div class="bg-gray-900 p-2 rounded border border-gray-800 text-[10px] space-y-1"><p class="text-white font-bold"> Name: ' + pData.gameName + ' | UID: ' + pData.gameUID + '</p><div class="flex gap-1 items-center"><input type="number" id="kill-' + key + '-' + pUID + '" placeholder="Kills" class="w-12 p-1 bg-gray-800 border border-gray-700 rounded text-white text-center"><label class="text-[9px] text-yellow-500 flex items-center gap-1 ml-2"><input type="checkbox" id="booyah-' + key + '-' + pUID + '"> Booyah?</label></div></div>';
                }
                playerListHTML += '</div>';
            } else { playerListHTML = '<p class="text-[10px] text-gray-500 font-bold italic mt-2">No players joined yet.</p>'; }
                                                
            adminMatchesControl.innerHTML += '<div class="bg-gray-800 p-4 border border-gray-700 rounded-[2rem] space-y-3 text-xs relative mb-2"><button onclick="deleteMatch(\'' + key + '\')" class="absolute top-3 right-3 text-red-500 text-sm p-1"><i class="fa-solid fa-trash-can"></i></button><div class="font-black text-white pr-6"><span class="text-yellow-500">[' + m.category + ']</span> ' + m.title + '<div class="text-[10px] text-gray-400 font-bold">Slots: ' + joinedCount + '/' + (m.slots || 50) + ' | Per Kill: ৳' + (m.perkill || 0) + '</div></div>' + playerListHTML + '<div class="flex gap-2"><input type="text" id="rid-' + key + '" placeholder="Room ID" value="' + (m.roomId || '') + '" class="w-full p-2 bg-gray-700 border border-gray-600 rounded-lg text-white font-mono text-[11px]"><input type="text" id="rpass-' + key + '" placeholder="Room Pass" value="' + (m.roomPass || '') + '" class="w-full p-2 bg-gray-700 border border-gray-600 rounded-lg text-white font-mono text-[11px]"></div><div class="flex gap-2"><button onclick="updateRoomLive(\'' + key + '\')" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-black text-[10px] uppercase">Update Room</button><button onclick="submitMatchResult(\'' + key + '\')" class="flex-1 bg-green-600 text-white py-2 rounded-lg font-black text-[10px] uppercase">Publish Result</button></div></div>';
        }
    }

    db.ref('money_requests').on('value', function(snap) {
        const depList = document.getElementById('admin-dep-list');
        const wdList = document.getElementById('admin-wd-list');
        if(!depList || !wdList) return;
        depList.innerHTML = ""; wdList.innerHTML = "";
        const requests = snap.val();
        if(!requests) {
            depList.innerHTML = "No requests found."; wdList.innerHTML = "No requests found."; return;
        }                                        
        for(let key in requests) {
            const req = requests[key];
            if(req.status !== 'pending') continue;
            const elementHTML = '<div class="p-3 bg-gray-800 border border-gray-700 rounded-xl flex justify-between items-center mb-2"><div><p class="font-black text-white">' + req.name + ' (ID: ' + req.shortId + ')</p><p class="text-[9px] text-slate-400">' + (req.type === 'Deposit' ? 'TrxID' : 'Number') + ': <b class="text-yellow-500 font-mono">' + req.info + '</b></p><p class="font-black text-green-500 mt-1">৳' + req.amount + '</p></div><div class="flex flex-col gap-1"><button onclick="approveRequest(\'' + key + '\', \'' + req.type + '\', \'' + req.uid + '\', ' + req.amount + ')" class="bg-green-600 text-white px-3 py-1.5 rounded-lg font-black text-[9px] uppercase">Approve</button><button onclick="rejectRequest(\'' + key + '\', \'' + req.type + '\', \'' + req.uid + '\', ' + req.amount + ')" class="bg-red-600 text-white px-3 py-1.5 rounded-lg font-black text-[9px] uppercase">Reject</button></div></div>';
            if(req.type === 'Deposit') depList.innerHTML += elementHTML;
            else wdList.innerHTML += elementHTML;
        }
    });

    function approveRequest(key, type, uid, amt) {
        if(type === 'Deposit') {
            db.ref('users/' + uid).transaction(function(user) {
                if(user) user.balance = (user.balance || 0) + amt;
                return user;
            });
        }
        db.ref('money_requests/' + key).update({ status: 'approved' }).then(function() { alert("Request Approved!"); });
    }

    function rejectRequest(key, type, uid, amt) {
        if(type === 'Withdraw') {
            db.ref('users/' + uid).transaction(function(user) {
                if(user) user.balance = (user.balance || 0) + amt;
                return user;
            });
        }
        db.ref('money_requests/' + key).update({ status: 'rejected' }).then(function() { alert("Request Rejected!"); });
    }

    // SUBMIT AND PUBLISH RESULT LIST
    function submitMatchResult(matchKey) {
        if(!confirm("আপনি কি নিশ্চিত এই ম্যাচের রেজাল্ট পাবলিশ করতে চান?")) return;
        const m = allMatches[matchKey];
        if(!m.joinedPlayers) {
            db.ref('matches/' + matchKey).update({ status: 'completed' });
            return alert("কোনো প্লেয়ার না থাকায় ম্যাচ ক্লোজ করা হলো।");
        }
        const perKillPrize = m.perkill || 0;
        let matchWinnersLog = [];

        for(let pUID in m.joinedPlayers) {
            const pData = m.joinedPlayers[pUID];
            const killInput = document.getElementById('kill-' + matchKey + '-' + pUID);
            const booyahCheck = document.getElementById('booyah-' + matchKey + '-' + pUID);                                                                        
            
            const kills = killInput ? Math.max(0, parseInt(killInput.value) || 0) : 0;
            const isBooyah = booyahCheck ? booyahCheck.checked : false;
            let totalPrizeWon = kills * perKillPrize;
            if(isBooyah) totalPrizeWon += (m.prize || 0); 

            db.ref('users/' + pUID).transaction(function(user) {
                if(user) {
                    user.balance = (user.balance || 0) + totalPrizeWon;
                    user.matchesPlayed = (user.matchesPlayed || 0) + 1;
                    user.totalKills = (user.totalKills || 0) + kills;
                    user.totalWon = (user.totalWon || 0) + totalPrizeWon;
                }
                return user;
            });
            matchWinnersLog.push({ gameName: pData.gameName, gameUID: pData.gameUID, kills: kills, won: totalPrizeWon, isBooyah: isBooyah });
        }                                        
        
        db.ref('matches/' + matchKey).update({
            status: 'completed',
            winners: matchWinnersLog,
            completedAt: Date.now()
        }).then(() => {
            alert("Results Published and Match Closed Successfully!");
        });
    }
</script>
